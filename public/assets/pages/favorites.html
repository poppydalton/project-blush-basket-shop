<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <title>BlushBasket | Favorites</title>
    <link rel="stylesheet" href="../styles/blushbasket-styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg blush-navbar sticky-top">
        <div class="container blush-nav-shell">
            <a class="navbar-brand blush-brand" href="../index.html">BlushBasket</a>

            <div class="d-flex gap-2 ms-auto">
                <a href="../index.html" class="btn blush-secondary-action">Home</a>
                <a href="women.html" class="btn blush-secondary-action">Women</a>
                <a href="men.html" class="btn blush-secondary-action">Men</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <h1 class="blush-search-title">Favorites ❤️</h1>

        <div id="favoritesList" class="row g-4 mt-3"></div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const container = document.getElementById('favoritesList');

            function getFavorites() {
                return JSON.parse(sessionStorage.getItem('favorites')) || [];
            }

            function saveFavorites(list) {
                sessionStorage.setItem('favorites', JSON.stringify(list));
            }

            function render() {

                const favorites = getFavorites();
                container.innerHTML = '';

                if (favorites.length === 0) {
                    container.innerHTML = `<p>No favorites yet.</p>`;
                    return;
                }

                favorites.forEach(item => {

                    container.innerHTML += `
                        <div class="col-md-4">
                            <div class="card blush-product-card shadow-sm">

                                <img src="${item.image}" class="blush-product-image">

                                <div class="card-body">
                                    <h5 class="blush-card-title">${item.title}</h5>
                                    <p class="blush-card-text">${item.description}</p>

                                    <button class="btn btn-danger remove-fav" data-title="${item.title}">
                                        Remove from Favorites ❌
                                    </button>

                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            document.addEventListener('click', function (e) {

                const btn = e.target.closest('.remove-fav');
                if (!btn) return;

                let favorites = getFavorites();
                const title = btn.dataset.title;

                favorites = favorites.filter(f => f.title !== title);

                saveFavorites(favorites);
                render();
            });

            render();
        });
    </script>

</body>

</html>
