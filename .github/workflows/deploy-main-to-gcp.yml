name: deploy-main-to-gcp.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_DIR: /home/poppydalton545/project-blush-basket-shop
          PM2_NAME: ${{ vars.PM2_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -T "$SSH_USER@$SSH_HOST" << EOF
            set -e

            echo "WHOAMI:"
            whoami

            echo "HOME DIR:"
            echo $HOME

            echo "APP_DIR VALUE:"
            echo "$APP_DIR"

            echo "PWD BEFORE CD:"
            pwd

            echo "TRYING TO CD INTO APP_DIR:"
            cd "$APP_DIR" || { echo "FAILED TO CD INTO $APP_DIR"; exit 1;}      

            echo "PWD AFTER CD:"
            pwd

            echo "LISTING DIRECTORY CONTENTS:"
            ls -la

            git pull --ff-only
            npm ci --prefix server

            pm2 restart "$PM2_NAME" || pm2 start server/app.js --name "$PM2_NAME"
            pm2 save
          EOF