<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlushBasket | Favorites</title>
    <link rel="stylesheet" href="../styles/blushbasket-styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg blush-navbar sticky-top">
        <div class="container blush-nav-shell">
            <a class="navbar-brand blush-brand" href="../index.html">BlushBasket</a>

            <div class="d-flex gap-2 ms-auto">
                <a href="../index.html" class="btn blush-secondary-action">Home</a>
                <a href="women.html" class="btn blush-secondary-action">Women</a>
                <a href="men.html" class="btn blush-secondary-action">Men</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <h1 class="blush-search-title">Favorites ❤️</h1>

        <div id="favoritesList" class="row g-4 mt-3"></div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('favoritesList');

            let favorites = JSON.parse(sessionStorage.getItem('favorites')) || [];

            if (favorites.length === 0) {
                container.innerHTML = "<p>No favorites yet.</p>";
                return;
            }

            favorites.forEach(product => {
                const col = document.createElement('div');
                col.className = 'col-lg-6 col-md-6 col-sm-12';

                col.innerHTML = `
            <div class="card blush-product-card shadow-sm h-100">
                <div class="blush-product-image-wrap">
                    <img src="${product.image}" class="blush-product-image">
                </div>

                <div class="card-body">
                    <div class="blush-card-tag">${product.category}</div>
                    <h3 class="blush-card-title">${product.title}</h3>
                    <p class="blush-card-text">${product.description}</p>

                    <a href="${product.url}" target="_blank" class="btn blush-primary-action w-100">
                        View Item
                    </a>

                    <button class="btn blush-secondary-action w-100 mt-2 remove-btn">
                        Unadd from Favorites 💔
                    </button>
                </div>
            </div>
        `;

                const btn = col.querySelector('.remove-btn');

                btn.addEventListener('click', function () {
                    let updated = JSON.parse(sessionStorage.getItem('favorites')) || [];

                    updated = updated.filter(item => item.title !== product.title);

                    sessionStorage.setItem('favorites', JSON.stringify(updated));

                    col.remove();
                });

                container.appendChild(col);
            });
        });
    </script>

</body>

</html>
